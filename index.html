<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Legends of Bharata</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">

            <div class="title">
                🕉️ LEGENDS OF BHARATA
            </div>

            <div>
                ❤️ <span id="health">100</span>
            </div>

            <div>
                🪙 <span id="coins">0</span>
            </div>

            <div>
                ⭐ Level <span id="level">1</span>
            </div>

            <div>
                🏆 <span id="score">0</span>
            </div>

        </div>

        <div id="quest">
            📜 Quest: Defeat the forest guardians
        </div>

        <button id="pauseButton"
                onclick="togglePause()">
            ⏸
        </button>

    </div>


    <!-- START SCREEN -->

    <div id="startScreen" class="screen">

        <div class="logo">🕉️</div>

        <h1>LEGENDS OF BHARATA</h1>

        <h2>The Guardian's Journey</h2>

        <p>
            Enter the ancient realm and begin your journey.
        </p>

        <button onclick="startGame()">
            ⚔️ BEGIN JOURNEY
        </button>

        <div class="controlsText">

            <b>Keyboard</b><br>

            A / D or ◀ / ▶ — Move<br>
            W / ↑ — Jump<br>
            SPACE — Attack<br>
            P — Pause

        </div>

    </div>


    <!-- PAUSE -->

    <div id="pauseScreen"
         class="screen hidden">

        <h1>⏸ PAUSED</h1>

        <button onclick="togglePause()">
            ▶ CONTINUE
        </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOverScreen"
         class="screen hidden">

        <h1>⚔️ JOURNEY ENDED</h1>

        <p id="gameOverText"></p>

        <button onclick="restartGame()">
            🔄 PLAY AGAIN
        </button>

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="mobileControls">

        <div class="leftControls">

            <button
                ontouchstart="pressLeft()"
                ontouchend="releaseLeft()">
                ◀
            </button>

            <button
                ontouchstart="pressRight()"
                ontouchend="releaseRight()">
                ▶
            </button>

        </div>

        <div class="rightControls">

            <button onclick="jump()">
                ▲
            </button>

            <button onclick="attack()">
                ⚔️
            </button>

        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
